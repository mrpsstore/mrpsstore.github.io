<!DOCTYPE html>
<html lang="en" manifest="router.appcache">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MR PS Store | Smart Firmware Host</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body {
            color: #f4f8ff;
            background: #07101e url('../img.jpg') center center / cover no-repeat fixed;
            font-family: Arial, Tahoma, sans-serif;
        }
        body:before {
            content: "";
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(2, 9, 20, .42);
        }
        .topbar {
            position: relative;
            z-index: 1;
            width: 82%;
            height: 58px;
            margin: 22px auto 0;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #00d9ff;
            border-radius: 16px;
            background: rgba(5, 18, 36, .90);
            box-shadow: 0 0 24px rgba(0, 217, 255, .28);
            font-weight: bold;
            letter-spacing: 2px;
        }
        .brand { display: flex; align-items: center; font-size: 22px; }
        .brand img { width: 40px; height: 40px; margin-right: 12px; border-radius: 10px; }
        .online { color: #12f1ce; font-size: 16px; }
        .online:before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 9px; border-radius: 50%; background: #12f1ce; box-shadow: 0 0 12px #12f1ce; }
        .panel {
            position: relative;
            z-index: 1;
            width: 700px;
            max-width: 88%;
            margin: 9vh auto 0;
            padding: 34px 46px 32px;
            text-align: center;
            border: 2px solid rgba(0, 217, 255, .75);
            border-radius: 24px;
            background: rgba(4, 16, 34, .92);
            box-shadow: 0 0 50px rgba(0, 217, 255, .22), inset 0 0 34px rgba(19, 72, 120, .25);
        }
        .logo { width: 78px; height: 78px; object-fit: cover; border-radius: 18px; border: 2px solid #00d9ff; }
        h1 { margin: 16px 0 8px; color: #00dcff; font-size: 33px; letter-spacing: 3px; }
        .range { margin: 0 0 24px; color: #b9c9df; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        .status-box { padding: 18px; border: 1px solid #2b5c86; border-radius: 14px; background: rgba(0, 0, 0, .25); }
        #state { margin: 0; color: #fff; font-size: 25px; font-weight: bold; }
        #detail { min-height: 25px; margin-top: 9px; color: #60ffe5; font-size: 17px; font-weight: bold; }
        #countdown { margin-top: 20px; color: #ffcb3d; font-size: 17px; }
        .routes { margin-top: 21px; color: #aebed2; font-size: 14px; line-height: 1.7; }
        .error { color: #ff665b !important; }
        .ready { color: #60ffe5 !important; }
        .footer { position: fixed; z-index: 1; left: 0; right: 0; bottom: 16px; text-align: center; color: #e8f1ff; font-size: 15px; font-weight: bold; }
        .footer span { color: #ff3d45; }
    </style>
</head>
<body>
    <audio id="bg-music" src="music_background.mp3" autoplay loop></audio>

    <div class="topbar">
        <div class="brand"><img src="../icon0.png" alt="MR PS">MR PS STORE</div>
        <div class="online">SMART ROUTER ONLINE</div>
    </div>

    <main class="panel">
        <img class="logo" src="../icon0.png" alt="MR PS Store">
        <h1>MR SHERIF SMART HOST</h1>
        <p class="range">AUTOMATIC FIRMWARE DETECTION 5.05 - 13.00</p>
        <div class="status-box">
            <p id="state">DETECTING YOUR PS4 FIRMWARE...</p>
            <div id="detail"></div>
        </div>
        <div id="countdown"></div>
        <div class="routes">5.05 - 9.60 &nbsp;|&nbsp; 10.00 - 11.02 &nbsp;|&nbsp; 11.50 - 13.00<br>11.50 - 12.02: LAPSE &nbsp;&bull;&nbsp; 12.50 - 13.00: POOPS</div>
    </main>

    <div class="footer">Designed by: <span>@Mr Sherif</span> &nbsp;|&nbsp; MR PS Store</div>

    <script>
        (function () {
            var state = document.getElementById("state");
            var detail = document.getElementById("detail");
            var countdown = document.getElementById("countdown");
            var userAgent = navigator.userAgent || "";
            var match = userAgent.match(/(?:PlayStation 4|PS4)[\s\/]([\d.]+)/i);
            var firmware = match && match[1] ? parseFloat(match[1]) : NaN;
            var firmwareText = match && match[1] ? match[1] : "Unknown";
            var target = "";
            var engine = "";

            if (!isNaN(firmware)) {
                if (firmware >= 5.00 && firmware <= 9.60) {
                    target = "505_960/index.html";
                    engine = "5.05 - 9.60 ENGINE";
                } else if (firmware >= 10.00 && firmware <= 11.02) {
                    target = "1000_1102/index.html";
                    engine = "10.00 - 11.02 ENGINE";
                } else if (firmware >= 11.50 && firmware <= 13.00) {
                    target = "1150-1300/index.html";
                    engine = firmware <= 12.02 ? "LAPSE ENGINE" : (firmware >= 12.50 ? "POOPS ENGINE" : "");
                }
            }

            function startMusic() {
                var audio = document.getElementById("bg-music");
                if (!audio) return;
                try {
                    var promise = audio.play();
                    if (promise && typeof promise.catch === "function") promise.catch(function () {});
                } catch (error) {}
            }

            startMusic();
            document.addEventListener("keydown", startMusic, false);
            document.addEventListener("click", startMusic, false);

            if (!target || !engine) {
                state.innerHTML = "FIRMWARE NOT SUPPORTED";
                state.className = "error";
                detail.innerHTML = "Detected firmware: " + firmwareText;
                countdown.innerHTML = "Please return to the main menu.";
                return;
            }

            state.innerHTML = "FIRMWARE " + firmwareText + " DETECTED";
            state.className = "ready";
            detail.innerHTML = "Selected automatically: " + engine;

            var seconds = 10;
            function tick() {
                countdown.innerHTML = "Launching automatically in " + seconds + " seconds...";
                if (seconds <= 0) {
                    window.location.replace(target);
                    return;
                }
                seconds -= 1;
                window.setTimeout(tick, 1000);
            }
            tick();
        })();
    </script>
</body>
</html>
